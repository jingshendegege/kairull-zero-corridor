[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="*.bak,*.log,*.tmp,tools/*,spikes/*,scripts/test_*,scripts/render_*,scripts/audit_*"
export_path="../dist/index.html"

[preset.0.options]
custom_template/release="../.build-tools/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/head_include="<script src=\"https://vibe.lumigrav.space/sdk/v3/vibehub.js\"></script><script defer src=\"vibehub-bridge.js\"></script>"
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
